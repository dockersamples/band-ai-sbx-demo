[project]
name = "band-sbx-repo-doctor"
version = "0.1.0"
description = "A Band remote agent that repairs a broken Python project inside a Docker Sandbox."
requires-python = ">=3.11"
dependencies = [
  # Match the published workload used in this example.
  "band-sdk[pydantic-ai]==6.0.0",
  "pydantic-settings==2.15.0",
  # The agent runs the fixture's tests with its own interpreter, so pytest must
  # be part of the agent environment, not the fixture's.
  "pytest==9.1.1",
]

[dependency-groups]
dev = ["ruff==0.14.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
