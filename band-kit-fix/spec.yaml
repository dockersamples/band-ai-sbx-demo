schemaVersion: "2"
kind: sandbox
name: band-python-kit
displayName: Band Python Agent
description: Run a workspace Python agent on Band inside a Docker Sandbox.

sandbox:
  image: docker.io/bandhq/band-python-kit-image:1.6.0

setup:
  startup:
    - command:
        - /usr/local/bin/band-entrypoint.sh
        - /opt/band/venv/bin/python
        - -m
        - band.docker.launcher
      user: "0"
      background: true

permissions:
  network:
    allow:
      - app.band.ai
      - pypi.org
      - files.pythonhosted.org
      # Repo Doctor is Claude-specific for now. Keep provider egress and its
      # credential binding in the kit so a newly-created sandbox is complete.
      - api.anthropic.com

credentials:
  - service: anthropic
    description: Anthropic API key for Repo Doctor's Claude model
    apiKey:
      name: ANTHROPIC_API_KEY
      proxyManaged: true
      inject:
        # The Anthropic SDK sends API-key authentication in this header. The
        # VM sees only the proxy-managed sentinel; the host proxy replaces it
        # on requests to this exact provider host.
        - domain: api.anthropic.com
          header: x-api-key
          format: '%s'

agentInstructions:
  filename: AGENTS.md
  content: |
    This workspace contains a Python agent launched by the Band Sandbox kit.
    Agent configuration is in band.yaml.
    Dependency changes must update both pyproject.toml and uv.lock.
    Add network access only for the LLM provider, repository host, or service
    this agent actually uses; see the kit README's "Network access" section.
    Never print or commit configured credentials.
